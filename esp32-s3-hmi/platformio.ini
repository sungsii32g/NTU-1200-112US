[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 8MB Flash / 8MB PSRAM (OPI / QSPI)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_SPIRAM_CACHE_WORKAROUND
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
    ; UART2 Hardware Serial Pin Definition for NTU-1200 RJ11 Port
    -DNTU_UART_NUM=2
    -DNTU_RX_PIN=18     ; Connect to RS-232 to TTL Module TXD
    -DNTU_TX_PIN=17     ; Connect to RS-232 to TTL Module RXD
    -DNTU_BAUD_RATE=9600
    ; LCD Backlight PWM Pin
    -DLCD_BL_PIN=38
    -DCORE_DEBUG_LEVEL=3

lib_deps = 
    lvgl/lvgl @ ^8.3.11
    lovyan03/LovyanGFX @ ^1.1.12
